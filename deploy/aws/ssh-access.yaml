AWSTemplateFormatVersion: '2010-09-09'
Description: NOVA class workshop SSH rule for an existing security group.

Parameters:
  GroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Existing NOVA instance security group; no instance or group is created.
  ClientIpv4Cidr:
    Type: String
    Description: Current client public IPv4 followed by /32.
    AllowedPattern: '^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/32$'
    ConstraintDescription: Enter one valid IPv4 address with the exact /32 suffix.

Resources:
  ClassSshIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: { Ref: GroupId }
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      CidrIp: { Ref: ClientIpv4Cidr }
      Description: NOVA class workshop SSH from current client IPv4 only

Outputs:
  ExistingSecurityGroup:
    Value: { Ref: GroupId }
  AllowedClient:
    Value: { Ref: ClientIpv4Cidr }
